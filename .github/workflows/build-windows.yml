name: uzuy-windows-build

on:
  workflow_dispatch:

jobs:
  build-windows-msvc:
    name: 'build (windows, msvc)'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $BuildCacheVer = "v0.28.4"
          $File = "buildcache-windows.zip"
          $Uri = "https://github.com/mbitsnbites/buildcache/releases/download/$BuildCacheVer/$File"
          $WebClient = New-Object System.Net.WebClient
          $WebClient.DownloadFile($Uri, $File)
          7z x $File
          $CurrentDir = Convert-Path .
          echo "$CurrentDir/buildcache/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Vulkan SDK
        shell: pwsh
        run: .\.ci\scripts\windows\install-vulkan-sdk.ps1
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Patch vcpkg pkgconf acquisition
        shell: pwsh
        run: |
          $f = "externals/vcpkg/scripts/cmake/vcpkg_find_acquire_program(PKGCONFIG).cmake"
          $t = Get-Content $f -Raw
          $t = $t.Replace("https://mirror.msys2.org/mingw/mingw32/mingw-w64-i686-pkgconf-1~1.8.0-2-any.pkg.tar.zst", "https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-pkgconf-1~3.0.8-1-any.pkg.tar.zst")
          $t = $t.Replace("e5217d9c55ede4c15706b4873761cc6e987eabc1308120a3e8406571ae2993907f3776f2b2bba18d7aaec80ef97227696058cedc1b67a773530dc1e6077b95e6", "25f58ef6ab1f45d0f3b503d4e8008ef8e79a9716492b57c3ed3cdbe481d421bd2a1d9b210169c8d5a88cc05f496c91d5a2f8b6671d4cc9b0810150a384f237a8")
          $t = $t.Replace("mingw32/bin/pkg-config.exe", "mingw64/bin/pkg-config.exe")
          Set-Content $f $t -NoNewline
          echo "patched pkgconf acquisition"
      - name: Build local pkgconf tool and stub vcpkg PKGCONFIG
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolDir = Join-Path $env:RUNNER_TEMP "vcpkg-tool"
          Copy-Item -Recurse -Force "externals/vcpkg" $toolDir
          Push-Location $toolDir
          .\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg.exe install pkgconf:x64-windows
          Pop-Location
          $exe = Get-ChildItem "$toolDir/packages/pkgconf_x64-windows" -Recurse -Filter "pkgconf.exe" | Select-Object -First 1
          if (-not $exe) { throw "pkgconf.exe not found" }
          New-Item -ItemType Directory -Force "C:/vcpkg-pkgconf" | Out-Null
          Copy-Item -Force ((Split-Path $exe.FullName -Parent) + "/*") "C:/vcpkg-pkgconf/"
          $stub = @(
            'set(program_name "pkg-config")',
            'set(search_names "pkgconf.exe")',
            'list(APPEND paths_to_search "C:/vcpkg-pkgconf")',
            'set(version_command "--version")',
            'set(program_version "3.0.8")'
          ) -join [Environment]::NewLine
          Set-Content "externals/vcpkg/scripts/cmake/vcpkg_find_acquire_program(PKGCONFIG).cmake" $stub
          & "C:/vcpkg-pkgconf/pkgconf.exe" --version
      - name: Configure
        env:
          CC: cl.exe
          CXX: cl.exe
        run: |
          glslangValidator --version
          mkdir build
          cmake . -B build -GNinja -DCMAKE_TOOLCHAIN_FILE="CMakeModules/MSVCCache.cmake" -DUSE_CCACHE=ON -DYUZU_USE_BUNDLED_QT=1 -DYUZU_USE_BUNDLED_SDL2=1 -DYUZU_USE_QT_WEB_ENGINE=ON -DYUZU_ENABLE_COMPATIBILITY_REPORTING=OFF -DENABLE_COMPATIBILITY_LIST_DOWNLOAD=OFF -DUSE_DISCORD_PRESENCE=ON -DENABLE_QT_TRANSLATION=ON -DCMAKE_BUILD_TYPE=Release -DGIT_BRANCH=manual -DGIT_DESC=manual-build -DYUZU_CRASH_DUMPS=ON
      - name: Build
        run: cmake --build build
      - name: Pack
        shell: pwsh
        run: .\.ci\scripts\windows\upload.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uzuy-windows-msvc
          path: artifacts/
